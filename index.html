<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BOLBALL - Sınırsız Özgürlük v3.0</title>
    <!-- Plus Jakarta Sans Fontu -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0ea5e9;
            --primary-red: #ef4444;
            --primary-green: #22c55e;
            --primary-yellow: #eab308;
            --bg-light: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.88);
            --card-border: rgba(14, 165, 233, 0.2);
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-light); color: var(--text-main); 
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; 
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }
        
        #gameContainer { 
            position: relative; width: 100%; max-width: 600px; height: 100%; 
            margin: 0 auto; box-shadow: 0 0 40px rgba(14, 165, 233, 0.12); 
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #fef2f2 100%);
            overflow: hidden; transition: background 0.6s ease;
        }
        
        canvas { display: block; width: 100%; height: 100%; z-index: 1; touch-action: none; }

        .screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 10; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); 
            background: rgba(240, 249, 255, 0.88);
        }
        .screen.active { display: flex; animation: fadeIn 0.3s cubic-bezier(0.1, 0.8, 0.2, 1); }

        @keyframes fadeIn { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }

        /* LOGO ANİMASYONU: ZIT DÖNEN BAĞIMSIZ DIŞ VE İÇ HALKALAR + SICAK RENKLİ TOP */
        .hero-logo {
            position: relative; width: 150px; height: 150px; margin-bottom: 12px;
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Ortadaki Sıcak Renkli Geçişli Top */
        .logo-core {
            width: 54px; height: 54px; border-radius: 50%;
            z-index: 4;
            animation: warmCoreGlow 5s ease-in-out infinite alternate;
        }

        @keyframes warmCoreGlow {
            0% {
                background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ef4444 65%, #991b1b 100%);
                box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
            }
            33% {
                background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f97316 65%, #c2410c 100%);
                box-shadow: 0 4px 20px rgba(249, 115, 22, 0.5);
            }
            66% {
                background: radial-gradient(circle at 35% 35%, #ffffff 0%, #eab308 65%, #a16207 100%);
                box-shadow: 0 4px 20px rgba(234, 179, 8, 0.5);
            }
            100% {
                background: radial-gradient(circle at 35% 35%, #ffffff 0%, #ec4899 65%, #be185d 100%);
                box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5);
            }
        }
        
        /* 1. En Dış Halka - 2 Ayrı Parça Parçalı (Saat Yönü) */
        .ring-outer-1 {
            position: absolute; width: 140px; height: 140px; border-radius: 50%;
            border: 4px solid transparent;
            border-top-color: #ef4444;
            border-bottom-color: #f97316;
            animation: spinRingCW 3.5s linear infinite;
            z-index: 1;
        }

        /* 2. Dış Halka - 2 Ayrı Parça Parçalı (Zıt Yön) */
        .ring-outer-2 {
            position: absolute; width: 124px; height: 124px; border-radius: 50%;
            border: 4px solid transparent;
            border-left-color: #eab308;
            border-right-color: #ec4899;
            animation: spinRingCCW 2.6s linear infinite;
            z-index: 2;
        }

        /* İçteki Bağımsız Yaylar */
        .ring-arc { position: absolute; border-radius: 50%; pointer-events: none; z-index: 3; }
        .ring-arc-red {
            width: 86px; height: 86px;
            border: 3.5px solid transparent; border-top-color: #ef4444;
            animation: spinArcRed 2s linear infinite;
        }
        .ring-arc-blue {
            width: 102px; height: 102px;
            border: 3.5px solid transparent; border-right-color: #0ea5e9;
            animation: spinArcBlue 2.8s linear infinite reverse;
        }

        @keyframes spinRingCW { 100% { transform: rotate(360deg); } }
        @keyframes spinRingCCW { 100% { transform: rotate(-360deg); } }
        @keyframes spinArcRed { 100% { transform: rotate(360deg); } }
        @keyframes spinArcBlue { 100% { transform: rotate(-360deg); } }

        /* GÖSTERİŞLİ "BOLBALL" BAŞLIĞI */
        h1.title {
            font-size: 3.5rem; margin-bottom: 4px; font-weight: 900; letter-spacing: 6px; margin-top: 0;
            background: linear-gradient(135deg, #0ea5e9 0%, #ef4444 35%, #22c55e 70%, #0ea5e9 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0px 8px 25px rgba(14, 165, 233, 0.3);
            animation: titleShimmer 4s linear infinite;
            text-align: center;
        }

        @keyframes titleShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .score-board {
            display: flex; gap: 15px; margin-bottom: 20px; margin-top: 6px;
            background: var(--card-bg); padding: 10px 22px;
            border-radius: 18px; border: 1px solid var(--card-border);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.08);
        }
        .score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 90px; }
        .score-box .label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 2px; font-weight: 700; }
        .score-box .value { font-size: 1.45rem; font-weight: 900; color: var(--primary-blue); }
        .score-divider { width: 1px; background: rgba(0,0,0,0.08); margin: 0 4px; }

        /* Overlok Yuvarlak Butonlar */
        .btn { 
            border: none; 
            padding: 14px 28px; font-size: 1rem; font-weight: 800;
            border-radius: 50px; cursor: pointer; margin: 6px; transition: all 0.2s ease; 
            width: 80%; max-width: 280px; text-align: center;
            text-transform: uppercase; letter-spacing: 1.2px; position: relative;
        }
        
        .btn-start {
            background: linear-gradient(135deg, var(--primary-green), #16a34a);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.3);
        }
        .btn-start:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(34, 197, 94, 0.45); }

        .btn-settings {
            background: linear-gradient(135deg, var(--primary-blue), #0284c7);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.3);
        }
        .btn-settings:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(14, 165, 233, 0.45); }

        .btn-red {
            background: linear-gradient(135deg, var(--primary-red), #dc2626);
            color: #ffffff;
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }
        .btn-red:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(239, 68, 68, 0.45); }

        .btn:active { transform: translateY(1px); }

        #uiLayer { 
            position: absolute; top: 0; left: 0; right: 0; padding: 14px 18px; 
            display: flex; justify-content: space-between; align-items: center; z-index: 5; 
            background: linear-gradient(to bottom, rgba(240, 249, 255, 0.95), transparent);
            pointer-events: none;
        }
        .ui-stats { pointer-events: none; display: flex; gap: 14px;}
        .ui-text { font-size: 0.95rem; font-weight: 800; color: var(--text-main);}
        .highlight-blue { color: var(--primary-blue); font-size: 1.15rem; }
        .highlight-green { color: var(--primary-green); font-size: 1.15rem; }
        .highlight-red { color: var(--primary-red); font-size: 1.15rem; }
        
        .pause-btn {
            background: rgba(14, 165, 233, 0.15); border: 1.5px solid var(--primary-blue); color: var(--primary-blue);
            padding: 6px 16px; border-radius: 50px; font-weight: 800; cursor: pointer;
            pointer-events: auto; backdrop-filter: blur(4px); transition: 0.2s;
        }
        .pause-btn:hover { background: var(--primary-blue); color: #fff; }

        .confirm-box {
            display: flex; gap: 20px; margin-top: 25px; justify-content: center; width: 100%;
        }
        .icon-btn {
            width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 2.2rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s ease; color: #fff; box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .icon-btn-confirm { background: linear-gradient(135deg, #22c55e, #16a34a); }
        .icon-btn-confirm:hover { transform: scale(1.1); box-shadow: 0 10px 25px rgba(34, 197, 94, 0.4); }
        .icon-btn-cancel { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .icon-btn-cancel:hover { transform: scale(1.1); box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4); }

        .settings-header {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            margin: 10px 0; font-size: 1.4rem; font-weight: 900; color: var(--text-main);
        }
        .settings-header svg { stroke: var(--primary-blue); width: 24px; height: 24px; }

        .settings-container {
            width: 92%; max-width: 460px; height: 60vh; overflow-y: auto; padding: 14px; 
            background: var(--card-bg); border-radius: 18px; margin-bottom: 10px;
            border: 1px solid var(--card-border); box-sizing: border-box;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }
        .settings-category {
            font-size: 0.88rem; color: var(--primary-blue); border-bottom: 2px solid rgba(14, 165, 233, 0.2);
            margin-top: 12px; margin-bottom: 8px; padding-bottom: 4px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px;
        }
        .setting-item { 
            display: flex; justify-content: space-between; align-items: center; 
            font-size: 0.82rem; margin-bottom: 6px; padding: 8px 10px; 
            background: rgba(255,255,255,0.75); border-radius: 8px; transition: background 0.2s;
            border: 1px solid rgba(0,0,0,0.04); font-weight: 700;
        }
        .setting-item select { 
            padding: 5px 8px; border-radius: 6px; border: 1px solid var(--primary-blue); font-weight: 700; 
            background: #fff; color: var(--primary-blue); outline: none; cursor: pointer; max-width: 45%; font-size: 0.8rem;
        }

        .visual-selector-container { margin-bottom: 14px; }
        .visual-title { font-size: 0.82rem; font-weight: 800; margin-bottom: 6px; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.8px;}
        .visual-scroll {
            display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
            scrollbar-width: thin; scrollbar-color: var(--primary-blue) rgba(0,0,0,0.05);
        }
        
        .thumb-item {
            flex: 0 0 52px; height: 52px; border-radius: 10px; cursor: pointer;
            border: 2px solid rgba(0,0,0,0.1); transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            position: relative; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .thumb-item:hover { transform: translateY(-2px); border-color: rgba(0,0,0,0.3); }
        .thumb-item.active { border-color: var(--primary-blue); box-shadow: 0 0 10px rgba(14, 165, 233, 0.5); transform: translateY(-2px); }
        
        .thumb-label {
            position: relative; z-index: 2; width: 100%; text-align: center; padding: 2px 0;
            font-size: 0.58rem; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            background: rgba(15, 23, 42, 0.8); white-space: nowrap; text-overflow: ellipsis; overflow: hidden;
        }
        
        ::-webkit-scrollbar { width: 5px; height: 5px; } 
        ::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 10px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.04); border-radius: 10px; }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="uiLayer" style="display:none;">
        <div class="ui-stats">
            <div class="ui-text">Bölüm: <span id="levelVal" class="highlight-blue">1</span></div>
            <div class="ui-text">Top: <span id="ballVal" class="highlight-green">1</span></div>
            <div class="ui-text">Skor: <span id="scoreVal" class="highlight-red">0</span></div>
        </div>
        <button class="pause-btn" onclick="togglePause()">⏸ Durdur</button>
    </div>

<canvas id="gameCanvas"></canvas>

<!-- ANA MENÜ -->
<div id="mainMenu" class="screen active">
    <div class="hero-logo">
        <div class="ring-outer-1"></div>
        <div class="ring-outer-2"></div>
        <div class="ring-arc ring-arc-red"></div>
        <div class="ring-arc ring-arc-blue"></div>
        <div class="logo-core"></div>
    </div>
    
    <h1 class="title">BOLBALL</h1>
    
    <div class="score-board">
        <div class="score-box">
            <span class="label">🏆 En Yüksek</span>
            <span class="value" id="menuHighScore" style="color: var(--primary-red);">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-box">
            <span class="label">⭐ Son Skor</span>
            <span class="value" id="menuLastScore">0</span>
        </div>
    </div>

    <button class="btn btn-start" onclick="startGame()">▶ OYUNA BAŞLA</button>
    <button class="btn btn-settings" onclick="showScreen('settingsMenu')">⚙ AYARLAR & TEMALAR</button>
</div>

<!-- DURDURMA MENÜSÜ -->
<div id="pauseMenu" class="screen">
    <h2 style="font-size: 2.2rem; color: var(--primary-blue); margin-bottom: 20px;">⏸ OYUN DURDURULDU</h2>
    <button class="btn btn-start" onclick="togglePause()">▶ DEVAM ET</button>
    <button class="btn btn-settings" id="soundToggleBtn" onclick="toggleSoundFromPause()">🔊 SES EFEKTLERİ: AÇIK</button>
    <button class="btn btn-red" onclick="showConfirmExit()">🚪 ÇIKIŞ YAP</button>
</div>

<!-- ÇIKIŞ ONAY MENÜSÜ -->
<div id="confirmExitMenu" class="screen">
    <h2 style="font-size: 1.8rem; color: var(--text-main); text-align: center; max-width: 80%;">Oyundan çıkmak istediğinize emin misiniz?</h2>
    <div class="confirm-box">
        <button class="icon-btn icon-btn-confirm" onclick="confirmExit()">✓</button>
        <button class="icon-btn icon-btn-cancel" onclick="cancelExit()">✖</button>
    </div>
</div>

<!-- AYARLAR MENÜSÜ -->
<div id="settingsMenu" class="screen">
    <div class="settings-header">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>ÖZELLEŞTİRME</span>
    </div>
    <div class="settings-container" id="settingsList">
        <div id="visualSelectors"></div>
        <div id="dynamicSettings"></div>
    </div>
    <button class="btn btn-settings" onclick="saveSettingsAndReturn()">✓ KAYDET & DÖN</button>
</div>

<!-- OYUN BİTTİ EKRANI -->
<div id="gameOverMenu" class="screen">
    <h1 class="title" style="color: var(--primary-red); font-size: 3.2rem;">OYUN BİTTİ</h1>
    <div class="score-board" style="margin-top: 15px;">
        <div class="score-box">
            <span class="label">Ulaşılan Bölüm</span>
            <span class="value" id="finalLevel" style="color:var(--text-main);">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-box">
            <span class="label">Kazanılan Skor</span>
            <span class="value" id="finalScore" style="color: var(--primary-green);">0</span>
        </div>
    </div>
    <button class="btn btn-red" onclick="startGame()">🔄 YENİDEN BAŞLA</button>
    <button class="btn btn-settings" onclick="showScreen('mainMenu')">🏠 ANA MENÜ</button>
</div>

</div>

<script>
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (typeof r === 'number') r = [r, r, r, r];
            let radius = r[0] || 0;
            this.beginPath();
            this.moveTo(x + radius, y);
            this.lineTo(x + w - radius, y);
            this.quadraticCurveTo(x + w, y, x + w, y + radius);
            this.lineTo(x + w, y + h - radius);
            this.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            this.lineTo(x + radius, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - radius);
            this.lineTo(x, y + radius);
            this.quadraticCurveTo(x, y, x + radius, y);
            this.closePath();
            return this;
        };
    }

    let sysHighScore = localStorage.getItem('bolball_highscore') || 0;
    let sysLastScore = localStorage.getItem('bolball_lastscore') || 0;
    
    document.getElementById('menuHighScore').innerText = sysHighScore;
    document.getElementById('menuLastScore').innerText = sysLastScore;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const themes = [
        {name: "Buzul Mavi", bg: "linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #fef2f2 100%)", grid: "rgba(14, 165, 233, 0.08)"},
        {name: "Ateş Kırmızı", bg: "linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fed7aa 100%)", grid: "rgba(239, 68, 68, 0.08)"},
        {name: "Ferah Yeşil", bg: "linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #e0f2fe 100%)", grid: "rgba(34, 197, 94, 0.08)"},
        {name: "Güneş Sarı", bg: "linear-gradient(135deg, #fefce8 0%, #fef9c3 50%, #f0f9ff 100%)", grid: "rgba(234, 179, 8, 0.08)"},
        {name: "Gece Matris", bg: "linear-gradient(135deg, #0f172a 0%, #1e293b 100%)", grid: "rgba(255, 255, 255, 0.05)"}
    ];

    const ballTypes = [
        {name:"Beyaz", val:"#ffffff"}, 
        {name:"Açık Mavi", val:"#0ea5e9"},
        {name:"Kırmızı", val:"#ef4444"}, 
        {name:"Açık Yeşil", val:"#22c55e"},
        {name:"Sarı", val:"#eab308"}, 
        {name:"Turuncu", val:"#f97316"},
        {name:"Mor", val:"#a855f7"}, 
        {name:"Pembe", val:"#ec4899"},
        {name:"Lacivert", val:"#1e3a8a"},
        {name:"Camgöbeği", val:"#06b6d4"},
        {name:"Altın", val:"#f59e0b"},
        {name:"Siyah", val:"#18181b"}
    ];

    const settingsSchema = [
        { cat: "Görsel Seçenekler", items: [
            { id: "ballSize", label: "Top Boyutu", type: "select", options: ["Küçük", "Normal", "Büyük"], def: 1 },
            { id: "showHp", label: "Blok Canını Göster", type: "select", options: ["Açık", "Kapalı"], def: 0 },
            { id: "gridVisible", label: "Arka Izgara", type: "select", options: ["Kapalı", "Açık"], def: 1 }
        ]},
        { cat: "Efektler", items: [
            { id: "particles", label: "Vuruş Parçacıkları", type: "select", options: ["Kapalı", "Normal"], def: 1 },
            { id: "screenShake", label: "Ekran Titremesi", type: "select", options: ["Kapalı", "Hafif"], def: 1 },
            { id: "trailEffect", label: "Top İzi", type: "select", options: ["Kapalı", "Kısa", "Uzun"], def: 1 }
        ]},
        { cat: "Oynanış", items: [
            { id: "gameSpeed", label: "Atış Hızı", type: "select", options: ["Yavaş", "Normal", "Hızlı", "Çılgın"], def: 2 },
            { id: "aimStyle", label: "Nişan Çizgisi", type: "select", options: ["Düz", "Noktalı", "Lazer"], def: 1 },
            { id: "difficulty", label: "Zorluk", type: "select", options: ["Kolay", "Normal", "Zor"], def: 1 }
        ]},
        { cat: "Sistem", items: [
            { id: "soundFx", label: "Ses Efektleri", type: "select", options: ["Kapalı", "Açık"], def: 1 },
            { id: "haptic", label: "Titreşim", type: "select", options: ["Kapalı", "Açık"], def: 1 }
        ]}
    ];

    let userSettings = { theme: 0, ballStyle: 1 };

    function initSettings() {
        const visualDiv = document.getElementById('visualSelectors');
        
        let themeHTML = `<div class="visual-selector-container"><div class="visual-title">Arka Plan Teması</div><div class="visual-scroll" id="themeScroll">`;
        themes.forEach((t, i) => {
            themeHTML += `<div class="thumb-item ${i === userSettings.theme ? 'active' : ''}" style="background: ${t.bg} !important;" onclick="selectThumb('theme', ${i})">
                            <div class="thumb-label">${t.name}</div>
                          </div>`;
        });
        themeHTML += `</div></div>`;
        
        let ballHTML = `<div class="visual-selector-container"><div class="visual-title">Top Rengi</div><div class="visual-scroll" id="ballScroll">`;
        ballTypes.forEach((b, i) => {
            ballHTML += `<div class="thumb-item ${i === userSettings.ballStyle ? 'active' : ''}" style="background-color: ${b.val};" onclick="selectThumb('ballStyle', ${i})">
                            <div class="thumb-label">${b.name}</div>
                         </div>`;
        });
        ballHTML += `</div></div>`;
        
        visualDiv.innerHTML = themeHTML + ballHTML;

        const dList = document.getElementById('dynamicSettings');
        dList.innerHTML = "";
        settingsSchema.forEach(cat => {
            let catDiv = document.createElement('div');
            catDiv.className = 'settings-category';
            catDiv.innerText = cat.cat;
            dList.appendChild(catDiv);

            cat.items.forEach(item => {
                if(userSettings[item.id] === undefined) userSettings[item.id] = item.def; 
                let div = document.createElement('div');
                div.className = 'setting-item';
                let html = `<span>${item.label}</span><select id="set_${item.id}">`;
                item.options.forEach((opt, idx) => { html += `<option value="${idx}" ${idx === userSettings[item.id] ? 'selected' : ''}>${opt}</option>`; });
                html += `</select>`;
                div.innerHTML = html;
                dList.appendChild(div);
            });
        });
    }

    function selectThumb(type, index) {
        userSettings[type] = index;
        let container = document.getElementById(type === 'theme' ? 'themeScroll' : 'ballScroll');
        Array.from(container.children).forEach((child, i) => { child.classList.toggle('active', i === index); });
        if(type === 'theme') applySettings(); 
    }

    function saveSettingsAndReturn() {
        settingsSchema.forEach(cat => {
            cat.items.forEach(item => { userSettings[item.id] = parseInt(document.getElementById(`set_${item.id}`).value); });
        });
        applySettings(); showScreen('mainMenu');
    }

    function applySettings() {
        let theme = themes[userSettings.theme];
        document.getElementById('gameContainer').style.background = theme.bg;
        updatePauseSoundBtnText();
        resize();
    }

    // --- SES MOTORU ---
    let audioCtx = null;
    function playSound(type) {
        if(userSettings.soundFx === 0) return;
        if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        if(audioCtx.state === 'suspended') audioCtx.resume();
        
        let osc = audioCtx.createOscillator(); 
        let gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        
        if(type === 'hit') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + Math.random()*50, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        } else if (type === 'shoot') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(480, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(240, audioCtx.currentTime + 0.03);
            gain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
            osc.start(); osc.stop(audioCtx.currentTime + 0.03);
        } else if (type === 'laser') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }
    }

    function vibrate(ms) { if(userSettings.haptic === 1 && navigator.vibrate) navigator.vibrate(ms); }

    // --- OYUN KONTROL & PAUSE SİSTEMİ ---
    let gameState = 'menu'; 
    let isPaused = false;
    let level = 1, score = 0;
    let balls = [], blocks = [], powerUps = [], particles = [], floatTexts = [], activeLasers = [];
    let isShooting = false, allBallsFired = true, pendingExtraBalls = 0;
    let shootingInterval;
    let player = { x: 0, y: 0, ballCount: 1, ballsReady: 1 };
    
    let isAiming = false, aimAngle = 0, aimX = 0, aimY = 0;
    let shakeTime = 0, shakeIntensity = 0;
    const BOTTOM_OFFSET = 55; 

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = document.getElementById('gameContainer').getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);
        canvas.style.width = `${rect.width}px`;
        canvas.style.height = `${rect.height}px`;

        if(player.y === 0 || gameState === 'menu') {
            player.y = rect.height - BOTTOM_OFFSET; player.x = rect.width / 2;
        }
    }
    window.addEventListener('resize', resize);

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if (screenId) document.getElementById(screenId).classList.add('active');
        document.getElementById('uiLayer').style.display = (screenId === '') ? 'flex' : 'none';
    }

    function togglePause() {
        if(gameState !== 'playing' && gameState !== 'paused') return;
        if(!isPaused) {
            isPaused = true;
            gameState = 'paused';
            updatePauseSoundBtnText();
            showScreen('pauseMenu');
        } else {
            isPaused = false;
            gameState = 'playing';
            showScreen('');
        }
    }

    function toggleSoundFromPause() {
        userSettings.soundFx = userSettings.soundFx === 1 ? 0 : 1;
        updatePauseSoundBtnText();
        let sel = document.getElementById('set_soundFx');
        if(sel) sel.value = userSettings.soundFx;
    }

    function updatePauseSoundBtnText() {
        const btn = document.getElementById('soundToggleBtn');
        if(btn) {
            btn.innerText = userSettings.soundFx === 1 ? "🔊 SES EFEKTLERİ: AÇIK" : "🔇 SES EFEKTLERİ: KAPALI";
        }
    }

    function showConfirmExit() {
        showScreen('confirmExitMenu');
    }

    function cancelExit() {
        showScreen('pauseMenu');
    }

    function confirmExit() {
        isPaused = false;
        saveScores();
        gameState = 'menu';
        clearInterval(shootingInterval);
        showScreen('mainMenu');
    }

    function saveScores() {
        sysLastScore = score;
        localStorage.setItem('bolball_lastscore', sysLastScore);
        if(score > sysHighScore) {
            sysHighScore = score;
            localStorage.setItem('bolball_highscore', sysHighScore);
        }
        document.getElementById('menuHighScore').innerText = sysHighScore;
        document.getElementById('menuLastScore').innerText = sysLastScore;
    }

    function startGame() {
        if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        if(audioCtx.state === 'suspended') audioCtx.resume();
        showScreen(''); resize();
        
        const rect = document.getElementById('gameContainer').getBoundingClientRect();
        level = 1; score = 0; player.ballCount = 1; player.ballsReady = 1;
        player.x = rect.width / 2; player.y = rect.height - BOTTOM_OFFSET;
        pendingExtraBalls = 0; balls = []; blocks = []; powerUps = []; particles = []; floatTexts = []; activeLasers = [];
        isShooting = false; isAiming = false; isPaused = false; allBallsFired = true;
        updateUI(); generateBlocks();
        gameState = 'playing'; 
        if (!window.loopRunning) { window.loopRunning = true; gameLoop(); }
    }

    function updateUI() {
        document.getElementById('levelVal').innerText = level;
        document.getElementById('ballVal').innerText = player.ballsReady + " / " + player.ballCount;
        document.getElementById('scoreVal').innerText = score;
    }

    function doScreenShake(amt) { if(userSettings.screenShake === 0) return; shakeIntensity = amt * 1.2; shakeTime = 8; }

    function createParticles(x, y, color, count) {
        if(userSettings.particles === 0) return;
        let pCount = Math.min(count, 8);
        for(let i=0; i<pCount; i++) {
            particles.push({
                x: x, y: y, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10,
                life: 1.0, decay: Math.random()*0.06 + 0.03, color: color, size: Math.random()*2.5 + 1
            });
        }
    }

    function createFloatText(x, y, text, color) {
        floatTexts.push({ x: x, y: y, text: text, color: color, life: 1.0 });
    }

    function generateBlocks() {
        const rect = document.getElementById('gameContainer').getBoundingClientRect();
        blocks.forEach(b => b.y += rect.height * 0.075);
        powerUps.forEach(p => p.y += rect.height * 0.075);

        if (blocks.some(b => b.y + b.h > player.y - 12)) {
            gameState = 'gameover'; 
            document.getElementById('finalLevel').innerText = level;
            document.getElementById('finalScore').innerText = score; 
            saveScores();
            showScreen('gameOverMenu'); return;
        }

        const cols = 7; const padding = 7; const w = (rect.width - (padding * (cols + 1))) / cols; const h = w * 0.88; 
        let hpVal = Math.max(1, Math.floor(level * [0.7, 1.0, 1.5][userSettings.difficulty]));

        let rowItems = [];
        for(let i=0; i<cols; i++) rowItems.push('empty');
        
        let extraBallCol = Math.floor(Math.random() * cols);
        rowItems[extraBallCol] = 'extra_ball';

        for(let i=0; i<cols; i++) {
            if(rowItems[i] === 'extra_ball') continue;
            
            let rand = Math.random();
            if(rand > 0.38) {
                rowItems[i] = 'block';
            } else if (rand < 0.12) {
                rowItems[i] = Math.random() > 0.5 ? 'laser_v' : 'laser_h';
            }
        }

        if (!rowItems.includes('block')) {
            let emptyCols = rowItems.map((v, i) => v === 'empty' ? i : -1).filter(i => i !== -1);
            if(emptyCols.length > 0) {
                rowItems[emptyCols[Math.floor(Math.random() * emptyCols.length)]] = 'block';
            }
        }

        for(let i=0; i<cols; i++) {
            let posX = padding + (i * (w + padding));
            let type = rowItems[i];
            
            if (type === 'block') {
                blocks.push({ x: posX, y: 75, w: w, h: h, hp: hpVal, maxHp: hpVal, color: `hsl(${(level * 38) % 360}, 85%, 55%)` });
            } else if (type === 'extra_ball') {
                powerUps.push({ x: posX + w/2, y: 75 + h/2, r: 11, type: 'extra_ball' });
            } else if (type === 'laser_v' || type === 'laser_h') {
                powerUps.push({ x: posX + w/2, y: 75 + h/2, r: 11, type: type });
            }
        }
    }

    function fireLaser(x, y, dir) {
        playSound('laser'); doScreenShake(10); vibrate(25);
        activeLasers.push({ x: x, y: y, dir: dir, life: 18 });
        
        blocks.forEach(b => {
            let isHit = false;
            if(dir === 'v') {
                if(b.x <= x + 15 && b.x + b.w >= x - 15) isHit = true;
            } else {
                if(b.y <= y + 15 && b.y + b.h >= y - 15) isHit = true;
            }
            
            if(isHit) {
                b.hp = Math.max(0, b.hp - 15);
                score += 2; // Dengelenmiş Lazer Skor Artışı
                createParticles(b.x + b.w/2, b.y + b.h/2, b.color, 8);
            }
        });
        
        blocks = blocks.filter(b => {
            if(b.hp <= 0) {
                score += 5; // Kırılma Bonusu
                createFloatText(b.x + b.w/2, b.y, "+5", "#22c55e");
                return false;
            }
            return true;
        });
    }

    function getPointerPos(e) {
        let rect = canvas.getBoundingClientRect();
        let clientX = e.touches ? e.touches[0].clientX : e.clientX;
        let clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function handlePointerDown(e) {
        if(gameState !== 'playing' || isShooting || isPaused) return;
        isAiming = true; let pos = getPointerPos(e); updateAimAngle(pos.x, pos.y);
    }

    function handlePointerMove(e) {
        if(!isAiming || isPaused) return; e.preventDefault();
        let pos = getPointerPos(e); updateAimAngle(pos.x, pos.y);
    }

    function handlePointerUp() {
        if(!isAiming || isPaused) return; isAiming = false;
        shootBalls(aimAngle);
    }

    function updateAimAngle(x, y) {
        aimX = x; aimY = y;
        let dx = x - player.x; let dy = player.y - y; 
        let angle = Math.atan2(dy, dx);
        if (angle < 0.1) angle = 0.1;
        if (angle > Math.PI - 0.1) angle = Math.PI - 0.1; 
        aimAngle = angle;
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('touchstart', handlePointerDown, {passive: false});
    canvas.addEventListener('touchmove', handlePointerMove, {passive: false});
    window.addEventListener('touchend', handlePointerUp);

    function shootBalls(angle) {
        isShooting = true; allBallsFired = false; let ballsFired = 0;
        let spawnRate = [200, 100, 45, 15][userSettings.gameSpeed];
        let bColor = ballTypes[userSettings.ballStyle].val;
        let bSize = [4, 6.5, 9.5][userSettings.ballSize];
        let bSpeed = [9, 14, 20, 27][userSettings.gameSpeed];

        shootingInterval = setInterval(() => {
            if (gameState !== 'playing' || isPaused) { 
                if(gameState !== 'playing') clearInterval(shootingInterval); 
                return; 
            }
            balls.push({
                x: player.x, y: player.y - bSize - 2, 
                vx: Math.cos(angle) * bSpeed, vy: -Math.sin(angle) * bSpeed,
                r: bSize, color: bColor, returned: false, trail: [] 
            });
            ballsFired++; player.ballsReady--; playSound('shoot'); updateUI();
            if(ballsFired >= player.ballCount) { clearInterval(shootingInterval); allBallsFired = true; }
        }, spawnRate);
    }

    function gameLoop() {
        if(gameState === 'playing' && !isPaused) update();
        draw(); requestAnimationFrame(gameLoop);
    }

    function update() {
        const rect = document.getElementById('gameContainer').getBoundingClientRect();
        let allBallsReturned = true;
        if(shakeTime > 0) shakeTime--;

        for(let i=particles.length-1; i>=0; i--) { let p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.life-=p.decay; if(p.life<=0) particles.splice(i,1); }
        for(let i=floatTexts.length-1; i>=0; i--) { let f=floatTexts[i]; f.y-=1.2; f.life-=0.025; if(f.life<=0) floatTexts.splice(i,1); }
        for(let i=activeLasers.length-1; i>=0; i--) { activeLasers[i].life--; if(activeLasers[i].life<=0) activeLasers.splice(i,1); }

        balls.forEach(ball => {
            if (ball.returned) return;
            allBallsReturned = false;

            if(userSettings.trailEffect > 0) {
                ball.trail.push({x: ball.x, y: ball.y});
                if(ball.trail.length > (userSettings.trailEffect === 1 ? 4 : 12)) ball.trail.shift();
            }

            let speed = Math.hypot(ball.vx, ball.vy);
            let steps = Math.min(3, Math.ceil(speed / 7));
            let stepVx = ball.vx / steps;
            let stepVy = ball.vy / steps;

            for(let s = 0; s < steps; s++) {
                ball.x += stepVx; 
                ball.y += stepVy;

                if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; stepVx *= -1; playSound('hit'); }
                if (ball.x + ball.r > rect.width) { ball.x = rect.width - ball.r; ball.vx *= -1; stepVx *= -1; playSound('hit'); }
                if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; stepVy *= -1; playSound('hit'); } 

                if (Math.abs(ball.vy) < 0.8) { ball.vy += (ball.vy >= 0 ? 0.3 : -0.3); }

                for(let i = blocks.length - 1; i >= 0; i--) {
                    let b = blocks[i];
                    let cX = Math.max(b.x, Math.min(ball.x, b.x + b.w));
                    let cY = Math.max(b.y, Math.min(ball.y, b.y + b.h));
                    let dX = ball.x - cX, dY = ball.y - cY;

                    if ((dX * dX) + (dY * dY) < (ball.r * ball.r)) {
                        if (Math.abs(dX) > Math.abs(dY)) {
                            ball.vx *= -1; stepVx *= -1;
                        } else {
                            ball.vy *= -1; stepVy *= -1;
                        }
                        b.hp--; 
                        score += 1; // DENGELENMİŞ SKOR: Vuruş başı 1 puan
                        playSound('hit'); vibrate(4);
                        createParticles(cX, cY, b.color, 5);
                        
                        if(b.hp <= 0) {
                            score += 5; // Kırılma Bonusu: 5 puan
                            doScreenShake(4); createFloatText(b.x + b.w/2, b.y, "+5", "#22c55e");
                            createParticles(b.x + b.w/2, b.y + b.h/2, b.color, 10); blocks.splice(i, 1);
                        }
                        updateUI(); break;
                    }
                }

                for(let i = powerUps.length - 1; i >= 0; i--) {
                    let p = powerUps[i];
                    if(Math.hypot(ball.x - p.x, ball.y - p.y) < ball.r + p.r) {
                        playSound('hit'); createParticles(p.x, p.y, "#0ea5e9", 8);
                        if(p.type === 'extra_ball') { 
                            pendingExtraBalls++; 
                            createFloatText(p.x, p.y, "+1 TOP", "#0ea5e9"); 
                        }
                        else if (p.type === 'laser_v') {
                            createFloatText(p.x, p.y, "DİKEY", "#ef4444");
                            fireLaser(p.x, p.y, 'v');
                        }
                        else if (p.type === 'laser_h') {
                            createFloatText(p.x, p.y, "YATAY", "#ef4444");
                            fireLaser(p.x, p.y, 'h');
                        }
                        powerUps.splice(i, 1);
                    }
                }
            }

            if (ball.vy >= 0 && ball.y + ball.r >= rect.height - BOTTOM_OFFSET) {
                ball.returned = true; ball.y = rect.height - BOTTOM_OFFSET;
                ball.x = Math.max(ball.r + 5, Math.min(rect.width - ball.r - 5, ball.x));
                if(player.ballsReady === 0) player.x = ball.x; 
                player.ballsReady++; updateUI();
            }
        });

        if (isShooting && allBallsFired && allBallsReturned) {
            isShooting = false; balls = []; level++;
            player.ballCount += pendingExtraBalls; player.ballsReady = player.ballCount;
            pendingExtraBalls = 0; updateUI(); generateBlocks();
        }
    }

    // --- CAMSILIK HİSSİ VEREN İÇİ ŞEFFAF BLOK ÇİZİMİ ---
    function draw() {
        const rect = document.getElementById('gameContainer').getBoundingClientRect();
        ctx.clearRect(0, 0, rect.width, rect.height);
        ctx.save();
        if(shakeTime > 0) ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
        if(gameState !== 'playing' && gameState !== 'paused') { ctx.restore(); return; }

        let activeTheme = themes[userSettings.theme];

        if(userSettings.gridVisible === 1) {
            ctx.strokeStyle = activeTheme.grid; ctx.lineWidth = 1;
            for(let i=0; i<rect.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,rect.height); ctx.stroke(); }
            for(let i=0; i<rect.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(rect.width,i); ctx.stroke(); }
        }

        activeLasers.forEach(l => {
            ctx.save();
            ctx.globalAlpha = l.life / 18;
            let grad;
            if(l.dir === 'v') {
                grad = ctx.createLinearGradient(l.x-10, 0, l.x+10, 0);
                grad.addColorStop(0, "transparent"); grad.addColorStop(0.5, "#ef4444"); grad.addColorStop(1, "transparent");
                ctx.fillStyle = grad; ctx.fillRect(l.x - 10, 0, 20, rect.height);
                ctx.fillStyle = "#fff"; ctx.fillRect(l.x - 1.5, 0, 3, rect.height);
            } else {
                grad = ctx.createLinearGradient(0, l.y-10, 0, l.y+10);
                grad.addColorStop(0, "transparent"); grad.addColorStop(0.5, "#ef4444"); grad.addColorStop(1, "transparent");
                ctx.fillStyle = grad; ctx.fillRect(0, l.y - 10, rect.width, 20);
                ctx.fillStyle = "#fff"; ctx.fillRect(0, l.y - 1.5, rect.width, 3);
            }
            ctx.restore();
        });

        // İÇİ BOŞ CAMSI BLOK ÇİZİMİ
        blocks.forEach(block => {
            let r = 10;
            ctx.save();
            
            // 1. Şeffaf Camsı Arka Plan
            ctx.beginPath(); ctx.roundRect(block.x, block.y, block.w, block.h, r);
            ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
            ctx.fill();

            // 2. Üst Cam Parlama Yansıması
            ctx.beginPath();
            ctx.roundRect(block.x + 2, block.y + 2, block.w - 4, block.h * 0.35, [r-2, r-2, 2, 2]);
            let glassHighlight = ctx.createLinearGradient(block.x, block.y, block.x, block.y + block.h * 0.35);
            glassHighlight.addColorStop(0, "rgba(255, 255, 255, 0.45)");
            glassHighlight.addColorStop(1, "rgba(255, 255, 255, 0.0)");
            ctx.fillStyle = glassHighlight;
            ctx.fill();

            // 3. Canlı Neon Çerçeve Çizgisi
            ctx.beginPath(); ctx.roundRect(block.x, block.y, block.w, block.h, r);
            ctx.strokeStyle = block.color;
            ctx.lineWidth = 2;
            ctx.globalAlpha = Math.max(0.65, block.hp / block.maxHp);
            ctx.stroke();

            // 4. Can Değeri (HP) Metni
            ctx.globalAlpha = 1.0;
            if(userSettings.showHp === 0) {
                ctx.fillStyle = block.color;
                ctx.font = "900 16px 'Plus Jakarta Sans', Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(block.hp, block.x + block.w/2, block.y + block.h/2 + 1);
            }
            ctx.restore();
        });

        // PowerUp Nesneleri
        powerUps.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            if(p.type === 'extra_ball') {
                ctx.fillStyle = "#0ea5e9"; ctx.fill(); ctx.fillStyle = "#ffffff"; ctx.font = "bold 14px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("+", p.x, p.y);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 3 + Math.sin(Date.now()/150)*2, 0, Math.PI * 2); ctx.strokeStyle = "rgba(14, 165, 233, 0.8)"; ctx.lineWidth = 1.5; ctx.stroke();
            } else if (p.type === 'laser_v' || p.type === 'laser_h') {
                ctx.fillStyle = "#ef4444"; ctx.fill(); ctx.fillStyle = "#ffffff"; ctx.font = "bold 13px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; 
                ctx.fillText(p.type === 'laser_v' ? "↕" : "↔", p.x, p.y);
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 3 + Math.sin(Date.now()/100)*2, 0, Math.PI * 2); ctx.strokeStyle = "rgba(239, 68, 68, 0.8)"; ctx.lineWidth = 1.5; ctx.stroke();
            }
        });

        // Parçacıklar
        particles.forEach(p => {
            ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        });
        ctx.globalAlpha = 1.0;

        // Toplar
        balls.forEach(ball => {
            if(ball.returned) return;
            
            if(ball.trail.length > 0) {
                ctx.beginPath(); ctx.moveTo(ball.trail[0].x, ball.trail[0].y);
                for(let i=1; i<ball.trail.length; i++) ctx.lineTo(ball.trail[i].x, ball.trail[i].y);
                ctx.strokeStyle = ball.color; ctx.globalAlpha = 0.35; ctx.lineWidth = ball.r * 1.3; ctx.stroke(); ctx.globalAlpha = 1.0;
            }
            
            ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fillStyle = ball.color; ctx.fill();
        });

        // Nişan Çizgisi
        if(isAiming && !isShooting && !isPaused) {
            let aimLen = 2500;
            let endX = player.x + Math.cos(aimAngle) * aimLen; let endY = player.y - Math.sin(aimAngle) * aimLen;
            ctx.beginPath(); ctx.moveTo(player.x, player.y); ctx.lineTo(endX, endY);
            ctx.strokeStyle = userSettings.aimStyle === 2 ? "#ef4444" : (ballTypes[userSettings.ballStyle].val || "#0ea5e9");
            ctx.lineWidth = userSettings.aimStyle === 2 ? 2.5 : 2;
            if(userSettings.aimStyle === 1) ctx.setLineDash([7, 10]); else ctx.setLineDash([]);
            ctx.stroke(); ctx.setLineDash([]);
        }

        // Taban Çizgisi ve Oyuncu
        ctx.strokeStyle = "rgba(15, 23, 42, 0.2)"; ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(0, rect.height - BOTTOM_OFFSET); ctx.lineTo(rect.width, rect.height - BOTTOM_OFFSET); ctx.stroke(); ctx.setLineDash([]);

        ctx.fillStyle = "#0ea5e9";
        ctx.beginPath(); ctx.arc(player.x, player.y, 10, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.roundRect(player.x - 26, player.y + 10, 52, 6, 3); ctx.fill();

        // Yüzen Metinler
        floatTexts.forEach(f => {
            ctx.globalAlpha = Math.max(0, f.life); ctx.fillStyle = f.color; ctx.font = "800 18px 'Plus Jakarta Sans', Arial";
            ctx.textAlign = "center";
            ctx.fillText(f.text, f.x, f.y);
        });
        ctx.globalAlpha = 1.0; ctx.restore(); 
    }

    initSettings(); applySettings(); resize();
</script>

</body>
